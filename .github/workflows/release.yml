name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - name: Package
        run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies -o extension.vsix

      - name: Publish to VS Code Marketplace
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm dlx @vscode/vsce@3.9.2 publish --no-dependencies -i extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        # Use the CHANGELOG.md section for this tag when there is one
        # (written by `tgit version` before tagging); otherwise let GitHub
        # generate notes from the commits.
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md
          if head -n 1 release-notes.md | grep -qx "## $GITHUB_REF_NAME"; then
            echo "NOTES_ARGS=--notes-file release-notes.md" >> "$GITHUB_ENV"
          else
            echo "NOTES_ARGS=--generate-notes" >> "$GITHUB_ENV"
          fi

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" extension.vsix $NOTES_ARGS || gh release upload "$GITHUB_REF_NAME" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
