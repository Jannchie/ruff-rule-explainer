name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - name: Package
        run: pnpm dlx @vscode/vsce@3.9.2 package --no-dependencies -o extension.vsix

      - name: Publish to VS Code Marketplace
        run: pnpm dlx @vscode/vsce@3.9.2 publish --no-dependencies -i extension.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Attach VSIX to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" extension.vsix --generate-notes || gh release upload "$GITHUB_REF_NAME" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
